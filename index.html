<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cartes Wikipédia</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#10141c;--panel:#1a202c;--line:#2b3446;--txt:#e8ecf3;--dim:#8b95a8;--c:#9aa0a6;--r:#3fb950;--e:#a371f7;--l:#f5c518}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--txt);font:16px/1.4 Barlow,system-ui,sans-serif}
h1,h2,.ct{font-family:'Barlow Condensed',Impact,sans-serif}
main{max-width:1100px;margin:0 auto;padding:12px}
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;padding:10px 0}
.bar b{font-size:20px}
.pill{background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:4px 12px}
button,select,input{font:inherit;color:var(--txt);background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px 14px}
button{cursor:pointer;background:#2a5bd7;border-color:#2a5bd7;font-weight:500}
button.g{background:var(--panel);border-color:var(--line)}
button:disabled{opacity:.4;cursor:not-allowed}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--l);outline-offset:2px}
.tabs{display:flex;gap:8px;margin:6px 0 16px}
.box{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:16px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.auth{max-width:340px;margin:12vh auto;display:grid;gap:10px}
.err{color:#ff7b72;min-height:1.3em}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.card{background:#141923;border:3px solid var(--rc);border-radius:12px;overflow:hidden;box-shadow:0 0 14px var(--rg);position:relative}
.card .im{width:100%;aspect-ratio:3/4;object-fit:cover;background:#222b3b;display:block}
.card .ct{padding:8px 8px 2px;font-size:19px;line-height:1.1;text-align:center;min-height:2.4em;display:flex;align-items:center;justify-content:center}
.card .rn{padding:0 8px 8px;text-align:center;color:var(--rc);font-weight:500;font-size:14px}
.card .n{position:absolute;top:6px;right:6px;background:#000b;border-radius:999px;padding:0 8px;font-size:13px}
.card.c{--rc:var(--c);--rg:transparent}.card.r{--rc:var(--r);--rg:#3fb95044}
.card.e{--rc:var(--e);--rg:#a371f755}.card.l{--rc:var(--l);--rg:#f5c51877}
.card.lock{border-color:var(--line);box-shadow:none;opacity:.5}
.card.lock .im{display:flex;align-items:center;justify-content:center;font-size:48px;color:var(--dim)}
.ov{position:fixed;inset:0;background:#000d;overflow:auto;padding:16px;z-index:5}
.ov .grid{max-width:900px;margin:8vh auto 16px}
.pop{animation:pop .5s both;animation-delay:calc(var(--i)*.3s)}
@keyframes pop{from{opacity:0;transform:translateY(30px) scale(.8)}}
@media(prefers-reduced-motion:reduce){.pop{animation:none}}
@media(min-width:700px){.grid{grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:16px}}
</style>
</head>
<body><main id="app"></main>
<script>
const $ = (s) => document.querySelector(s), app = $('#app');
const RN = { c: 'Commune', r: 'Rare', e: 'Épique', l: 'Légendaire' };
let tok = localStorage.tok, isOp = localStorage.op === '1', S, CAT, RAR = {}, tab = 'shop', timer;

async function api(action, d = {}) {
  const r = await fetch('/api/game', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ action, token: tok, ...d }) });
  const j = await r.json().catch(() => ({ error: 'Réponse invalide' }));
  if (!r.ok) { if (r.status === 401 && tok) logout(); throw new Error(j.error || 'Erreur'); }
  return j;
}
function logout() { localStorage.clear(); tok = null; isOp = false; clearInterval(timer); authView(); }

// --- Wikipédia : image + titre, mis en cache
const wc = {};
function wiki(t) {
  return wc[t] ||= (async () => {
    try { const c = localStorage['w:' + t]; if (c) return JSON.parse(c); } catch {}
    try {
      const r = await fetch('https://fr.wikipedia.org/api/rest_v1/page/summary/' + encodeURIComponent(t.replace(/ /g, '_')));
      const j = await r.json();
      const w = { img: (j.thumbnail && j.thumbnail.source) || null, title: j.title || t };
      try { localStorage['w:' + t] = JSON.stringify(w); } catch {}
      return w;
    } catch { return { img: null, title: t }; }
  })();
}

function cardEl(id, count, i) {
  const name = id.slice(id.indexOf(':') + 1), r = RAR[id];
  const el = document.createElement('div');
  el.className = 'card ' + r + (i != null ? ' pop' : '');
  if (i != null) el.style.setProperty('--i', i);
  el.innerHTML = '<img class="im" alt=""><div class="ct"></div><div class="rn">' + RN[r] + '</div>' + (count > 1 ? '<span class="n">×' + count + '</span>' : '');
  el.querySelector('.ct').textContent = name;
  wiki(name).then((w) => { el.querySelector('.ct').textContent = w.title; const im = el.querySelector('img'); if (w.img) im.src = w.img; else im.style.visibility = 'hidden'; });
  return el;
}

// --- Connexion
function authView(msg) {
  app.innerHTML = '<form class="auth" id="f"><h1>Cartes Wikipédia</h1><input id="p" placeholder="Pseudo" autocomplete="username" required><input id="w" type="password" placeholder="Mot de passe" autocomplete="current-password" required><div class="err" id="e"></div><button data-a="login">Se connecter</button><button type="button" class="g" data-a="register">Créer un compte</button></form>';
  $('#e').textContent = msg || '';
  const go = async (a) => {
    try {
      const j = await api(a, { pseudo: $('#p').value, password: $('#w').value });
      tok = j.token; isOp = !!j.op; localStorage.tok = tok; localStorage.op = isOp ? '1' : '0';
      start();
    } catch (e) { $('#e').textContent = e.message; }
  };
  $('#f').onsubmit = (e) => { e.preventDefault(); go('login'); };
  app.querySelector('[data-a=register]').onclick = () => go('register');
}

// --- Joueur
function head() {
  return '<div class="bar"><b>' + S.pseudo + '</b><span class="row"><span class="pill">🪙 ' + S.coins + '</span><span class="pill">📦 ' + S.packs + '/10</span><button class="g" id="lo">Quitter</button></span></div><div class="tabs"><button class="' + (tab === 'shop' ? '' : 'g') + '" data-t="shop">Boutique</button><button class="' + (tab === 'col' ? '' : 'g') + '" data-t="col">Ma collection</button></div>';
}
function playerView() {
  clearInterval(timer);
  let h = head();
  if (tab === 'shop') {
    h += '<div class="box"><h2>Mes sachets</h2><p>Un sachet gratuit toutes les 10 minutes (10 maximum). <span id="cd"></span></p><div class="row">' +
      Object.entries(CAT).map(([t, o]) => '<button data-o="' + t + '"' + (S.packs < 1 ? ' disabled' : '') + '>Ouvrir un sachet ' + o.name + '</button>').join('') +
      '</div></div><div class="box"><h2>Boutique</h2><p>Un sachet contient 5 cartes, à ouvrir dans le thème de ton choix.</p><button id="buy"' + (S.coins < 100 ? ' disabled' : '') + '>Acheter un sachet — 100 coins</button></div><div class="err" id="e"></div>';
  } else {
    h += Object.entries(CAT).map(([t, o]) => {
      const ids = 'crel'.split('').flatMap((r) => o[r].map((n) => t + ':' + n));
      return '<h2>' + o.name + ' — ' + ids.filter((id) => S.cards[id]).length + '/' + ids.length + '</h2><div class="grid" id="g-' + t + '"></div>';
    }).join('');
  }
  app.innerHTML = h;
  $('#lo').onclick = logout;
  app.querySelectorAll('[data-t]').forEach((b) => (b.onclick = () => { tab = b.dataset.t; playerView(); }));
  if (tab === 'col') {
    for (const [t, o] of Object.entries(CAT)) {
      const g = $('#g-' + t);
      'crel'.split('').forEach((r) => o[r].forEach((n) => {
        const id = t + ':' + n;
        if (S.cards[id]) g.append(cardEl(id, S.cards[id]));
        else g.insertAdjacentHTML('beforeend', '<div class="card lock"><div class="im">?</div><div class="ct">???</div><div class="rn">&nbsp;</div></div>');
      }));
    }
    return;
  }
  const run = async (fn) => { try { await fn(); } catch (e) { $('#e').textContent = e.message; } };
  $('#buy').onclick = () => run(async () => { S = (await api('buy')).state; playerView(); });
  app.querySelectorAll('[data-o]').forEach((b) => (b.onclick = () => run(async () => {
    const j = await api('open', { theme: b.dataset.o }); S = j.state; reveal(j.drawn);
  })));
  if (S.next) {
    const tick = () => { const s = Math.ceil((S.next - Date.now()) / 1000); if (s <= 0) { clearInterval(timer); refresh(); return; } $('#cd').textContent = 'Prochain sachet dans ' + Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); };
    tick(); timer = setInterval(tick, 1000);
  } else $('#cd').textContent = 'Stock plein : ouvre un sachet pour relancer le compteur.';
}
function reveal(ids) {
  const ov = document.createElement('div'); ov.className = 'ov';
  const g = document.createElement('div'); g.className = 'grid';
  ids.forEach((id, i) => g.append(cardEl(id, 1, i)));
  const b = document.createElement('button'); b.textContent = 'Continuer'; b.style.cssText = 'display:block;margin:0 auto';
  b.onclick = () => { ov.remove(); playerView(); };
  ov.append(g, b); document.body.append(ov);
}
async function refresh() { S = (await api('me')).state; playerView(); }

// --- Opérateur
async function opView() {
  const users = (await api('users')).users;
  const opts = 'crel'.split('').length && Object.entries(CAT).map(([t, o]) => '<optgroup label="' + o.name + '">' + 'crel'.split('').flatMap((r) => o[r].map((n) => '<option value="' + t + ':' + n + '">' + RN[r] + ' — ' + n + '</option>')).join('') + '</optgroup>').join('');
  app.innerHTML = '<div class="bar"><b>Espace opérateur</b><button class="g" id="lo">Quitter</button></div><form class="box row" id="f" style="display:grid"><h2>Donner à un joueur</h2><select id="u" required><option value="">Choisir un joueur</option>' + users.map((u) => '<option>' + u + '</option>').join('') + '</select><input id="co" type="number" min="0" placeholder="Coins (optionnel)"><input id="pk" type="number" min="0" placeholder="Nombre de sachets (optionnel)"><select id="ca"><option value="">Aucune carte</option>' + opts + '</select><button>Donner</button><div class="err" id="e"></div></form>';
  $('#lo').onclick = logout;
  $('#f').onsubmit = async (e) => {
    e.preventDefault();
    try {
      await api('give', { pseudo: $('#u').value, coins: $('#co').value, packs: $('#pk').value, card: $('#ca').value });
      $('#e').style.color = '#3fb950'; $('#e').textContent = 'Envoyé à ' + $('#u').value;
      $('#co').value = $('#pk').value = ''; $('#ca').value = '';
    } catch (er) { $('#e').style.color = ''; $('#e').textContent = er.message; }
  };
}

async function start() { isOp ? opView() : refresh(); }
(async () => {
  try {
    CAT = (await api('catalog')).themes;
    for (const [t, o] of Object.entries(CAT)) 'crel'.split('').forEach((r) => o[r].forEach((n) => (RAR[t + ':' + n] = r)));
  } catch (e) { app.textContent = 'Erreur de chargement : ' + e.message; return; }
  tok ? start() : authView();
})();
</script>
</body>
</html>
