<!doctype html>
<html lang="fr" data-th="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#10141c">
<title>Cardex</title><link rel="manifest" href="/manifest.json"><link rel="apple-touch-icon" href="/icon.png"><link rel="icon" href="/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#10141c;--panel:#1a202c;--line:#2b3446;--txt:#e8ecf3;--dim:#8b95a8;--cb:#141923;--c:#9aa0a6;--r:#3fb950;--e:#a371f7;--l:#f5c518}
:root[data-th=light]{--bg:#f3f5f9;--panel:#fff;--line:#d5dbe6;--txt:#161b26;--dim:#5b6577;--cb:#eef1f7;--c:#6b7280;--r:#1a9a3a;--e:#7c3aed;--l:#c99700}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--txt);font:16px/1.4 Barlow,system-ui,sans-serif}
h1,h2,.ct{font-family:'Barlow Condensed',Impact,sans-serif}
main{max-width:1100px;margin:0 auto;padding:12px}
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;padding:10px 0}
.bar b{font-size:20px}
.pill{background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:4px 12px}
button,select,input,textarea{font:inherit;color:var(--txt);background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px 14px}
textarea{width:100%}
button{cursor:pointer;background:#2a5bd7;border-color:#2a5bd7;color:#fff;font-weight:500}
button.g{background:var(--panel);border-color:var(--line);color:var(--txt)}
button:disabled{opacity:.4;cursor:not-allowed}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--l);outline-offset:2px}
.tabs{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 16px}
.box{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:16px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.auth{max-width:340px;margin:12vh auto;display:grid;gap:10px}
.err{color:#ff7b72;min-height:1.3em}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}
details{border-top:1px solid var(--line);padding:8px 0}summary{cursor:pointer;font-weight:500}
.sm{height:6px;background:var(--line);border-radius:4px;overflow:hidden;margin:4px 0}.sm i{display:block;height:100%;transition:width .2s}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;margin-top:10px}
.card{background:var(--cb);border:3px solid var(--rc);border-radius:12px;overflow:hidden;box-shadow:0 0 14px var(--rg);position:relative}
.card .im{width:100%;aspect-ratio:3/4;object-fit:cover;background:#222b3b;display:block}
.card .ct{padding:8px 8px 2px;font-size:19px;line-height:1.1;text-align:center;min-height:2.4em;display:flex;align-items:center;justify-content:center}
.card .rn{padding:0 8px 6px;text-align:center;color:var(--rc);font-weight:500;font-size:14px}
.card .n{position:absolute;top:6px;right:6px;background:#000b;color:#fff;border-radius:999px;padding:0 8px;font-size:13px}
.card .ac{display:flex;gap:4px;padding:0 6px 8px}.card .ac button{padding:4px 8px;font-size:13px}.card .ac button:last-child{flex:1}
.card.c{--rc:var(--c);--rg:transparent}.card.r{--rc:var(--r);--rg:#3fb95044}
.card.e{--rc:var(--e);--rg:#a371f755}.card.l{--rc:var(--l);--rg:#f5c51877}
.card.e::after,.card.l::after{content:'';position:absolute;inset:0;pointer-events:none;background:linear-gradient(115deg,transparent 30%,#fff5 50%,transparent 70%);background-size:250% 100%;animation:sh 3s infinite}
@keyframes sh{from{background-position:150% 0}to{background-position:-50% 0}}
.card.lock{border-color:var(--line);box-shadow:none;opacity:.5}
.card.lock .im{display:flex;align-items:center;justify-content:center;font-size:48px;color:var(--dim)}
.pk{display:flex;align-items:center;justify-content:center;height:90px;border-radius:10px;font-size:52px;background:linear-gradient(135deg,var(--pc),#0009);margin-bottom:8px}
.pk.big{width:180px;height:240px;font-size:96px;margin:18vh auto 0}
.shake{animation:shake .16s infinite}
@keyframes shake{0%,100%{transform:rotate(-5deg) scale(1.05)}50%{transform:rotate(5deg) scale(1.12)}}
.ov{position:fixed;inset:0;background:#000d;overflow:auto;padding:16px;z-index:5;color:#e8ecf3}
.ov .grid{max-width:900px;margin:8vh auto 16px}
.pop{animation:pop .5s both;animation-delay:calc(var(--i)*.3s)}
@keyframes pop{from{opacity:0;transform:translateY(30px) scale(.8)}}
@media(prefers-reduced-motion:reduce){.pop,.shake,.card::after{animation:none!important}}
@media(min-width:700px){.grid{grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:16px}}
#toasts{position:fixed;bottom:16px;left:0;right:0;display:flex;flex-direction:column;align-items:center;gap:8px;z-index:20;pointer-events:none}
.toast{pointer-events:auto;background:var(--panel);color:var(--txt);border:1px solid var(--line);border-radius:12px;padding:10px 16px;max-width:90%;box-shadow:0 4px 20px #0006;cursor:pointer;animation:pop .4s both}
.ov .box{color:var(--txt)}
html{-webkit-text-size-adjust:100%}
button,select,input,textarea{min-height:44px;font-size:16px;touch-action:manipulation}
.card .ac button{min-height:36px;font-size:13px}
canvas{touch-action:none}
.pad button{min-width:60px;min-height:60px;font-size:24px}
@media(max-width:600px){
main{padding:8px 8px calc(84px + env(safe-area-inset-bottom))}
.bar{padding:6px 0}.bar b{font-size:18px}
.tabs{position:fixed;bottom:0;left:0;right:0;margin:0;background:var(--panel);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom));display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:4px;z-index:4}
.tabs button{padding:8px 2px;font-size:13px}
.grid{grid-template-columns:repeat(2,1fr);gap:10px}
.grid2{grid-template-columns:1fr}
.box{padding:12px}
.card .ct{font-size:16px}
.ov{padding:10px}
.pk.big{width:140px;height:190px;margin-top:12vh}
#toasts{bottom:calc(76px + env(safe-area-inset-bottom))}
.auth{margin:6vh auto}
}
@media(max-width:600px){.grid{grid-template-columns:repeat(4,1fr);gap:6px}.card{border-width:2px;border-radius:8px}.card .ct{font-size:11px;padding:4px 2px 0;min-height:2.6em}.card .rn{font-size:9px;padding:0 2px 3px}.card .ac button{font-size:9px;padding:2px;min-height:28px}.card .n{font-size:10px}.tabs button{font-size:11px}}
.pills{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin-bottom:8px;-webkit-overflow-scrolling:touch}.pills::-webkit-scrollbar{display:none}.pill{flex:none;padding:5px 14px;border-radius:999px;border:1px solid var(--line);background:var(--panel);color:var(--txt);font-size:12px}.pill.on{background:var(--l);border-color:var(--l);color:#000}.rt{width:100%;border-collapse:collapse;font-size:12px}.rt th,.rt td{padding:4px 3px;text-align:center;border-top:1px solid var(--line)}.rt .pn{text-align:left;max-width:96px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.rt .me{background:var(--cb);font-weight:700}details.rb{border-color:var(--l)}details.rb>summary{color:var(--l)}
.lg{width:28px;height:28px;object-fit:contain;border-radius:6px}.tr{display:flex;flex-wrap:wrap;align-items:center;gap:8px}.mt .ac,.mt [data-rb],.mt #dup{display:none!important}.tr .card{width:78px}.tr small{display:block;text-align:center}

.pills{flex-wrap:wrap;overflow:visible}
.dm{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:14px;background:var(--panel);margin-bottom:8px;cursor:pointer}
.dm:active{background:var(--cb)}.dm .tx{flex:1;min-width:0}.dm .tx b,.dm .tx small{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.av{flex:none;width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;color:#fff}
.un{flex:none;background:#e5484d;color:#fff;border-radius:999px;min-width:22px;padding:1px 7px;text-align:center;font-size:12px;font-weight:700}
#dmt{display:flex;flex-direction:column;max-height:52vh;overflow-y:auto;padding:4px 2px}
.bub{max-width:82%;padding:8px 12px;border-radius:16px;margin:3px 0;white-space:pre-wrap;word-wrap:break-word;overflow-wrap:anywhere}
.bub.me{align-self:flex-end;background:#2a5bd7;color:#fff;border-bottom-right-radius:4px}.bub.th{align-self:flex-start;background:var(--cb);border-bottom-left-radius:4px}
.bub small{display:block;opacity:.7;font-size:11px;margin-top:2px}
.sysb{align-self:center;width:92%;border:1px dashed var(--l);border-radius:12px;padding:8px 10px;margin:6px 0;font-size:14px;text-align:center;overflow-wrap:anywhere}
.sysb button{margin-top:6px;min-height:36px;font-size:13px}
.sysb small{display:block;opacity:.7;margin-top:2px}

#splash{position:fixed;inset:0;z-index:99999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;padding:24px;text-align:center;background:var(--bg);color:var(--txt);transition:opacity .45s}
#splash.out{opacity:0;pointer-events:none}
#splash img{width:104px;height:104px;border-radius:24px;animation:spl 1.6s ease-in-out infinite}
@keyframes spl{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
#splash h1{margin:0;font-size:28px;letter-spacing:.5px}
#splash .sb{width:min(280px,72vw);height:8px;border-radius:99px;background:var(--line);overflow:hidden}
#splash .sb i{display:block;height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,#2a5bd7,#5aa0ff);transition:width .3s linear}
#splash .tip{min-height:70px;max-width:320px;font-size:16px;line-height:1.45;color:var(--dim);transition:opacity .35s}
#splash .tip.f{opacity:0}
/* Renaissance : animation */
#rbo{position:fixed;inset:0;z-index:30;background:#000c;display:flex;align-items:center;justify-content:center;padding:12px;color:#e6edf3;animation:rbIn .25s both}
@keyframes rbIn{from{opacity:0}}
#rbo .dlg{width:100%;max-width:340px;background:#161b22;border:1px solid #30363d;border-radius:12px;padding:16px}
#rbo .dlg h3{margin:0 0 8px;font-size:20px}
#rbo .dlg p{margin:0 0 14px;font-size:14px;color:#8b949e;line-height:1.5}
#rbo .bts{display:flex;gap:10px}
#rbo .bts button{flex:1}
#rbs{position:relative;height:520px;width:100%;max-width:380px;border-radius:12px;background:#0d1117;overflow:hidden;animation:rbBg 10s ease forwards}
@keyframes rbBg{0%{background:#0d1117}25%{background:#1f1346}55%{background:#0e2c4d}80%{background:#10301f}100%{background:#0d1117}}
#rbs .a{position:absolute}
#rbs .k{position:absolute;width:54px;height:74px;border:2px solid var(--k);border-radius:6px;background:#161b22;padding:4px;animation:rbCv 1.5s var(--d) ease-in forwards}
#rbs .im{height:34px;border-radius:3px;opacity:.4;margin-bottom:5px}
#rbs .ln{height:4px;border-radius:2px;background:#30363d;margin-bottom:4px}
#rbs .ln.s{width:60%}
@keyframes rbCv{0%{transform:none;opacity:1}30%{transform:translate(0,-10px) rotate(-8deg) scale(1.1)}100%{transform:translate(var(--dx),var(--dy)) rotate(540deg) scale(.15);opacity:0}}
#rbs .r{left:50%;top:200px;width:40px;height:40px;margin:-20px 0 0 -20px;border-radius:50%;border:4px solid var(--q);opacity:0;animation:rbRg 1.4s var(--d) ease-out forwards}
@keyframes rbRg{0%{opacity:1;transform:scale(.5)}100%{opacity:0;transform:scale(8)}}
#rbs .em{left:50%;top:200px;width:84px;height:84px;margin:-42px 0 0 -42px;border-radius:50%;border:5px solid #f5c518;background:#161b22;display:flex;align-items:center;justify-content:center;font-size:42px;transform:scale(0);opacity:0;animation:rbEm .8s 1.4s cubic-bezier(.34,1.56,.64,1) forwards,rbBc 3s 2.2s linear infinite}
#rbs .em i{font-style:normal;animation:rbSp 4s 2.2s linear infinite}
@keyframes rbEm{to{transform:scale(1);opacity:1}}
@keyframes rbSp{to{transform:rotate(360deg)}}
@keyframes rbBc{0%,100%{border-color:#f5c518}25%{border-color:#a371f7}50%{border-color:#39c5cf}75%{border-color:#3fb950}}
#rbs .p{left:50%;top:200px;width:9px;height:9px;margin:-4px 0 0 -4px;background:var(--q);opacity:0;animation:rbPp 1.2s 1.5s ease-out forwards}
@keyframes rbPp{0%{opacity:1;transform:translate(0,0)}100%{opacity:0;transform:translate(var(--x),var(--y)) rotate(200deg)}}
#rbs .cf{top:-20px;width:var(--w);height:calc(var(--w)*1.5);background:var(--q);opacity:0;animation:rbCf var(--t) var(--d) ease-in forwards}
@keyframes rbCf{0%{opacity:0;transform:translateY(0) rotate(0)}6%{opacity:1}85%{opacity:1}100%{opacity:0;transform:translateY(560px) rotate(540deg)}}
#rbs .t{left:0;right:0;text-align:center;opacity:0;transform:translateY(10px);animation:rbFu .6s var(--d) ease-out forwards}
#rbs .tt{animation:rbFu .6s var(--d) ease-out forwards,rbTc 2.4s 2.8s linear infinite}
@keyframes rbFu{to{opacity:1;transform:none}}
@keyframes rbTc{0%,100%{color:#f5c518}25%{color:#a371f7}50%{color:#39c5cf}75%{color:#3fb950}}
#rbs .pb{left:16px;right:16px;top:62px;height:10px;border-radius:5px;background:#30363d;overflow:hidden}
#rbs .pb i{display:block;height:100%;width:100%;background:#3fb950;animation:rbBw 1s 1.2s ease-in forwards}
@keyframes rbBw{to{width:0}}
#rbs .sk{top:10px;right:12px;padding:4px 12px;border-radius:16px;font-size:13px;font-weight:400;background:#161b22;border-color:#30363d;color:#e6edf3;animation:rbOut .3s 6.4s forwards}
@keyframes rbOut{to{opacity:0;visibility:hidden}}
#rbs .u{left:12px;right:12px;bottom:12px;background:#161b22;border:1px solid #30363d;border-radius:10px;padding:10px 12px;display:flex;align-items:center;gap:10px;opacity:0;transform:translateY(40px);z-index:3;animation:rbFu .5s 6.4s ease-out forwards}
#rbs .u button{white-space:nowrap}
@media(prefers-reduced-motion:reduce){#rbo,#rbs{animation:none}}
/* Livre des renaissances + encart maintenance */
.bkw{margin:12px 0}.bkw h2{margin:0 0 4px}.gld{color:var(--l)}
.bkk{position:relative;margin:8px 0;padding:12px 12px 12px 30px;border-radius:10px;background:linear-gradient(135deg,#1d2536,#10151f);border:1px solid #4a3f1c;box-shadow:inset 0 0 0 2px #0006}
.bkk::before{content:"";position:absolute;left:9px;top:10px;bottom:10px;width:8px;background:radial-gradient(circle at 4px 50%,#d6dbe6 0 3.5px,#0000 4px) 0 0/8px 44px repeat-y}
.bkp{display:block;text-align:right;color:#8b95a8;margin-bottom:4px}
.bkg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.bkq{aspect-ratio:5/7;border-radius:6px;border:1px dashed #ffffff26;background:#ffffff0a}
.bkc{aspect-ratio:5/7;border-radius:6px;border:2px solid #f5c518;background:linear-gradient(160deg,#3d3210,#16110a);box-shadow:0 0 12px #f5c51840;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:4px;text-align:center;color:#f5c518;overflow:hidden}
.bkc .bke{font-size:30px;line-height:1}.bkc b{font-size:12px}.bkc small{display:block;color:#e8d9a0;font-size:10px}
.mbx ul{margin:4px 0 8px;padding-left:20px}.mbx li{margin:2px 0}
</style>

<body><main id="app"></main>
<script>
const $ = (s) => document.querySelector(s), app = $('#app');
const RN = { c: 'Commune', r: 'Rare', e: 'Épique', l: 'Légendaire' };
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
let tok = localStorage.tok, isOp = localStorage.op === '1', asP = localStorage.asp === '1', S, CAT = {}, RAR = {}, tab = 'shop', timer, sort = 'def', openT = new Set();

if ('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js').catch(() => {});
function setTheme(t) { document.documentElement.dataset.th = t; localStorage.th = t; }
setTheme(localStorage.th || 'dark');
async function flip() {
  const t = document.documentElement.dataset.th === 'dark' ? 'light' : 'dark'; setTheme(t);
  if (!isOp) try { await api('settings', { theme: t }); } catch {}
}
function setCat(c) { CAT = c; RAR = {}; for (const [t, o] of Object.entries(CAT)) [...'crel'].forEach((r) => o[r].forEach((n) => (RAR[t + ':' + n] = r))); }
function setS(s) { S = s; setCat(s.themes); if (s.theme && s.theme !== localStorage.th) setTheme(s.theme); }

async function api(action, d = {}) {
  const r = await fetch('/api/game', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ action, token: tok, ...(isOp && asP ? { as: 'player' } : {}), ...d }) });
  const t = await r.text(); let j; try { j = JSON.parse(t); } catch { j = { error: 'Réponse invalide (code ' + r.status + ') : ' + t.slice(0, 120) }; if (r.ok) throw new Error(j.error); }
  if (!r.ok) { if (r.status === 401 && tok) logout(); throw new Error(j.error || 'Erreur'); }
  return j;
}
function logout() { localStorage.removeItem('tok'); localStorage.removeItem('op'); localStorage.removeItem('asp'); asP = false; tok = null; isOp = false; clearInterval(timer); authView(); }

// --- Wikipédia : image + titre, mis en cache
const wc = {};
function wiki(t) {
  return wc[t] ||= (async () => {
    try { const c = localStorage['w:' + t]; if (c) return JSON.parse(c); } catch {}
    try {
      const r = await fetch('https://fr.wikipedia.org/api/rest_v1/page/summary/' + encodeURIComponent(t.replace(/ /g, '_')));
      if (!r.ok) return { img: null, title: t };
      const j = await r.json();
      const w = { img: (j.thumbnail && j.thumbnail.source) || null, title: j.title || t };
      try { localStorage['w:' + t] = JSON.stringify(w); } catch {}
      return w;
    } catch { return { img: null, title: t }; }
  })();
}
function cardEl(id, count, i) {
  const name = id.slice(id.indexOf(':') + 1), r = RAR[id] || 'c';
  const el = document.createElement('div');
  el.className = 'card ' + r + (i != null ? ' pop' : '');
  if (i != null) el.style.setProperty('--i', i);
  el.innerHTML = '<img class="im" alt=""><div class="ct"></div><div class="rn">' + RN[r] + '</div>' + (count > 1 ? '<span class="n">×' + count + '</span>' : '');
  el.querySelector('.ct').textContent = name;
  wiki(name).then((w) => { el.querySelector('.ct').textContent = w.title; const im = el.querySelector('img'); if (w.img) im.src = w.img; else im.style.visibility = 'hidden'; });
  return el;
}

// --- Solidité du mot de passe (indicatif)
function dur(s) {
  const t = [['seconde', 1], ['minute', 60], ['heure', 3600], ['jour', 86400], ['an', 31536000], ['siècle', 3153600000]];
  if (s < 1) return 'instantané';
  if (s >= 3153600000 * 1000) return 'plus de 1000 siècles';
  let r = t[0]; for (const x of t) if (s >= x[1]) r = x;
  const n = Math.floor(s / r[1]); return n + ' ' + r[0] + (n > 1 ? 's' : '');
}
function meter(p) {
  const el = $('#sm'); if (!p) { el.innerHTML = ''; return; }
  let n = 0; if (/[a-z]/.test(p)) n += 26; if (/[A-Z]/.test(p)) n += 26; if (/\d/.test(p)) n += 10; if (/[^A-Za-z0-9]/.test(p)) n += 32;
  let bits = p.length * Math.log2(n || 1);
  if (/1234|azerty|qwerty|password|motdepasse|0000|1111/i.test(p)) bits = Math.min(bits, 20);
  const lv = bits < 28 ? ['Très faible', '#ff7b72'] : bits < 40 ? ['Faible', '#f0883e'] : bits < 60 ? ['Moyen', '#e3b341'] : bits < 80 ? ['Fort', '#3fb950'] : ['Très fort', '#2ea043'];
  el.innerHTML = '<div class="sm"><i style="width:' + Math.min(100, bits / 80 * 100) + '%;background:' + lv[1] + '"></i></div><small style="color:' + lv[1] + '">' + lv[0] + ' — craqué en ' + dur(Math.pow(2, bits) / 2e10) + ' environ</small>';
}

function authView(msg) {
  app.innerHTML = '<form class="auth" id="f"><img src="/icon-192.png" alt="Cardex" style="width:110px;margin:0 auto"><h1>Cardex</h1><input id="p" placeholder="Pseudo" autocomplete="username" required><input id="w" type="password" placeholder="Mot de passe" autocomplete="current-password" required><div id="sm"></div><div class="err" id="e"></div><button data-a="login">Se connecter</button><button type="button" class="g" data-a="register">Créer un compte</button><button type="button" class="g" id="th">🌓 Thème</button></form>';
  $('#e').textContent = msg || '';
  $('#th').onclick = flip;
  $('#w').oninput = (e) => meter(e.target.value);
  const go = async (a) => {
    try {
      const j = await api(a, { pseudo: $('#p').value, password: $('#w').value });
      tok = j.token; isOp = !!j.op; localStorage.tok = tok; localStorage.op = isOp ? '1' : '0';
      start();
    } catch (e) { $('#e').textContent = e.message; }
  };
