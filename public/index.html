.card.m{--rc:var(--m);--rg:#ff2d4a99;--dl:#ff5a6e38}.card.s{--rc:var(--s);--rg:#38bdf8aa;--dl:#7dd3fc4a}.card.u{--rc:var(--u);--rg:#d946ef88}

}

.pills{flex-wrap:wrap;overflow:visible}

@keyframes dysl{from{transform:translateY(-36px);opacity:0}}
@keyframes dyup{from{transform:translateY(10px);opacity:0}}
@keyframes dypl{50%{border-color:#1b3a82}}
@keyframes dypo{40%{transform:scale(1.07)}}
@keyframes dyfl{to{transform:translateY(-26px);opacity:0}}
.dyh{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}.dyh>b{font-size:18px}
.dyb{position:relative;font-weight:500}.dyf{position:absolute;right:10px;top:-8px;font-size:13px;font-weight:500;color:#3fb950}
.dyc{display:flex;align-items:center;gap:12px}.dyi{width:40px;height:40px;border-radius:50%;background:var(--ac);display:flex;align-items:center;justify-content:center;font-size:20px}
.dyc small{display:block;color:var(--dim)}
.dyg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin:14px 0}
.dyt{display:flex;justify-content:space-between;align-items:center;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--cb);font-size:14px;color:var(--dim);animation:dyup .4s both}
.dyt.done{border-color:#238636;color:#3fb950}
.dyt.now{border:2px solid var(--ac);color:var(--txt);animation:dyup .4s both,dypl 1.4s ease-in-out infinite}
.dyt.big{grid-column:1/-1;border-color:#6f4fc4;color:#a371f7}.dyt.big.now{color:var(--txt)}
.dyt.dyp{animation:dypo .45s}
@media(prefers-reduced-motion:reduce){.dyn,.dyt,.dyt.now,.dyf{animation:none!important}}
/* Course */
.rl{margin-bottom:6px}.rl .ln{display:flex;justify-content:space-between;font-size:13px}.rl.me .ln b{color:var(--l)}
.trk{position:relative;height:40px;border-bottom:2px dashed var(--line);margin:16px 0 10px}
.trk .fl{position:absolute;right:0;top:0;bottom:0;width:8px;background:repeating-conic-gradient(#000 0 25%,#fff 0 50%) 0 0/8px 8px;opacity:.85}
.car{position:absolute;bottom:2px;left:0;width:56px;transition:left 1.8s cubic-bezier(.3,.7,.2,1)}
.car svg{display:block}
.car .ph{position:absolute;left:18px;top:-17px;width:20px;height:20px;border-radius:50%;border:2px solid #fff;object-fit:cover;background:var(--c);color:#fff;font-size:11px;display:flex;align-items:center;justify-content:center;margin:0;box-sizing:content-box}
.car .wh{transform-box:fill-box;transform-origin:center}
.car.mv svg{animation:cbob .25s ease-in-out infinite}.car.mv .wh{animation:cspin .35s linear infinite}
.cgain{position:absolute;left:22px;top:-34px;font-weight:600;color:#3fb950;animation:cgo 1.6s ease-out forwards;white-space:nowrap}
@keyframes cbob{50%{transform:translateY(-1px)}}@keyframes cspin{to{transform:rotate(360deg)}}@keyframes cgo{to{transform:translateY(-22px);opacity:0}}
@media(prefers-reduced-motion:reduce){.car{transition:none}.car.mv svg,.car.mv .wh{animation:none}}
.pf{width:24px;height:24px;border-radius:50%;object-fit:cover;vertical-align:middle;margin-left:6px}
details.fvb{border-color:var(--l)}details.fvb>summary{color:var(--l)}
/* Snake : habillage carte Cardex */
.card.x{--rc:var(--lo);--rg:transparent}.card.o{--rc:var(--or);--rg:transparent}
.sn{max-width:440px;margin:3vh auto}
.snh{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}.snh h2{margin:0;font-size:26px}
.card.sk{width:100%;max-width:min(400px,50vh);margin:0 auto;border-width:3px;border-radius:12px;transition:border-color .3s}
.card.sk .ct{font-size:22px;min-height:0;padding:8px 8px 2px}
.card.sk .rn{font-size:15px;padding:0 8px 8px}
.card.sk::after{content:none}
.snv{position:relative;line-height:0}
.snv canvas{display:block;width:100%;aspect-ratio:1/1;background:var(--sn-a)}
.snv canvas:focus-visible{outline:2px solid var(--l);outline-offset:-2px}
.snt{position:absolute;left:8px;right:8px;bottom:8px;line-height:1.3;text-align:center;font-size:14px;padding:6px 10px;border-radius:8px;background:var(--panel);color:var(--txt);border:1px solid var(--line);pointer-events:none}
.snb{position:absolute;top:8px;left:50%;transform:translateX(-50%);line-height:1.2;padding:4px 14px;border-radius:6px;font:700 18px 'Barlow Condensed',Impact,sans-serif;white-space:nowrap;opacity:0;pointer-events:none}
.snb.on{opacity:1;animation:snp 1.5s ease forwards}
@keyframes snp{0%{opacity:0}12%{opacity:1}75%{opacity:1}100%{opacity:0}}
.sns{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;max-width:min(400px,50vh);margin:10px auto}
.sns>div{background:var(--cb);border:1px solid var(--line);border-radius:10px;padding:6px 8px;text-align:center}
.sns small{display:block;color:var(--dim);font-size:11px;text-transform:uppercase;letter-spacing:.06em}
.sns b{font:700 22px 'Barlow Condensed',Impact,sans-serif;font-variant-numeric:tabular-nums}
.sn .pos,.snw .pos{color:var(--r)}.sn .neg,.snw .neg{color:var(--lo)}.sn .zero,.snw .zero{color:var(--dim)}
.sdot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px}
.snl{display:flex;flex-direction:column;gap:3px;font-size:14px;margin-top:6px}
.sntb{width:100%;border-collapse:collapse;font-size:14px;margin:10px 0}
.sntb th,.sntb td{padding:5px 6px;text-align:left;border-top:1px solid var(--line)}
.sntb th{color:var(--dim);font-weight:500;font-size:12px;text-transform:uppercase;letter-spacing:.05em}
@media(prefers-reduced-motion:reduce){.card.sk{transition:none}.snb.on{animation:none}}

</head>
<body><main id="app"></main>
<script>
const $ = (s) => document.querySelector(s), app = $('#app');
const RN = { c: 'Commune', r: 'Rare', e: 'Épique', l: 'Légendaire', m: 'Mythique', s: 'Céleste', u: 'Unique' };
const RA = 'crelmsu', RAREV = 'usmlerc', BDN = { 1: 'Bronze', 2: 'Argent', 3: 'Or' }, BDI = { 1: '🥉', 2: '🥈', 3: '🥇' }; // raretés (de la plus commune à la plus rare) ; badges
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const pfImg = (p) => (p ? '<img class="pf" src="' + p + '" alt="">' : '');
let tok = localStorage.tok, isOp = localStorage.op === '1', asP = localStorage.asp === '1', S, CAT = {}, RAR = {}, tab = 'shop', timer, sort = 'def', openT = new Set();

if ('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js').catch(() => {});
// --- Thème de saison (choisi par l'opérateur, identique pour tous) : Octobre rose, Été, Hiver, Halloween + thèmes créés par l'opérateur
const SKINS = { rose: '🎀', ete: '🌞', hiver: '❄️', halloween: '🎃' };
let SKC = {}, SKK = '', SKPV = false; // SKC : thèmes personnalisés connus ; SKK : thème affiché ; SKPV : aperçu opérateur en cours
try { const d = JSON.parse(localStorage.skd || 'null'); if (d && d.id) SKC[d.id] = d; } catch {}
function metaTheme() { const m = document.querySelector('meta[name=theme-color]'); if (m) m.content = getComputedStyle(document.documentElement).getPropertyValue('--bg').trim() || '#10141c'; }
function hsl(h, s, l) { s /= 100; l /= 100; const a = s * Math.min(l, 1 - l), f = (n) => { const k = (n + h / 30) % 12; return l - a * Math.max(-1, Math.min(k - 3, 9 - k, 1)); }; return '#' + [f(0), f(8), f(4)].map((x) => Math.round(x * 255).toString(16).padStart(2, '0')).join(''); }
function skinPal(hex) {
  const r = parseInt(hex.slice(1, 3), 16) / 255, g = parseInt(hex.slice(3, 5), 16) / 255, b = parseInt(hex.slice(5, 7), 16) / 255, mx = Math.max(r, g, b), mn = Math.min(r, g, b), d = mx - mn;
  let h = 0; if (d) h = mx === r ? ((g - b) / d + (g < b ? 6 : 0)) * 60 : mx === g ? ((b - r) / d + 2) * 60 : ((r - g) / d + 4) * 60;
  const gray = d < 0.06 ? 0.25 : 1, lum = 0.299 * r + 0.587 * g + 0.114 * b;
  return {
    ac2: hsl(h, 80, 72), acf: lum > 0.6 ? '#1a1a1a' : '#fff',
    dark: { bg: hsl(h, 38 * gray, 8), panel: hsl(h, 34 * gray, 13), line: hsl(h, 30 * gray, 24), cb: hsl(h, 36 * gray, 10), txt: hsl(h, 60 * gray, 95), dim: hsl(h, 22 * gray, 68) },
    light: { bg: hsl(h, 100 * gray, 96), panel: hsl(h, 100 * gray, 99), line: hsl(h, 60 * gray, 85), cb: hsl(h, 100 * gray, 92), txt: hsl(h, 50 * gray, 12), dim: hsl(h, 25 * gray, 36) },
  };
}
function skinCss(c) {
  const p = skinPal(c.ac), v = (o) => Object.entries(o).map(([k, x]) => '--' + k + ':' + x).join(';'), e = String(c.emoji || '').replace(/["'\\<>&]/g, '');
  return ':root[data-sk=custom]{--ac:' + c.ac + ';--ac2:' + p.ac2 + ';--acf:' + p.acf + ';--ske:"' + (e ? ' ' + e : '') + '"}:root[data-sk=custom][data-th=dark]{' + v(p.dark) + '}:root[data-sk=custom][data-th=light]{' + v(p.light) + '}';
}
function setSkin(k, preview) {
  const c = SKC[k]; k = SKINS[k] || c ? k : ''; SKK = k; SKPV = !!preview;
  const root = document.documentElement;
  if (c) root.dataset.sk = 'custom'; else if (k) root.dataset.sk = k; else delete root.dataset.sk;
  let st = document.getElementById('skx'); if (!st) { st = document.createElement('style'); st.id = 'skx'; document.head.appendChild(st); }
  st.textContent = c ? skinCss(c) : '';
  if (!preview) { try { if (k) { localStorage.sk = k; if (c) localStorage.skd = JSON.stringify(c); else localStorage.removeItem('skd'); } else { localStorage.removeItem('sk'); localStorage.removeItem('skd'); } } catch {} }
  metaTheme();
}
function subPal(hex) {
  const n = (i) => parseInt(hex.slice(i, i + 2), 16), r = n(1) / 255, g = n(3) / 255, b = n(5) / 255, mx = Math.max(r, g, b), mn = Math.min(r, g, b), d = mx - mn;
  let hh = 0; if (d) hh = mx === r ? ((g - b) / d + (g < b ? 6 : 0)) * 60 : mx === g ? ((b - r) / d + 2) * 60 : ((r - g) / d + 4) * 60;
  const dark = 0.299 * r + 0.587 * g + 0.114 * b < 0.5, gray = d < 0.06, w = dark ? '#ffffff' : '#000000';
  const mix = (a, c, t) => '#' + [1, 3, 5].map((i) => Math.round(parseInt(a.slice(i, i + 2), 16) * (1 - t) + parseInt(c.slice(i, i + 2), 16) * t).toString(16).padStart(2, '0')).join('');
  const txt = dark ? '#f5f5f5' : '#161616', ac = gray ? (dark ? '#d0d0d0' : '#444444') : hsl(hh, 75, dark ? 66 : 38);
  return { bg: hex, panel: mix(hex, w, 0.09), cb: mix(hex, w, 0.05), line: mix(hex, w, 0.22), txt, dim: mix(txt, hex, 0.42), ac, ac2: gray ? mix(ac, hex, 0.3) : hsl(hh, 80, dark ? 78 : 50), acf: dark ? '#1a1a1a' : '#ffffff' };
}
function setSubColor(hex) { // la couleur choisie prime sur le thème de saison ; vide = couleur par défaut
  const r = document.documentElement; let st = document.getElementById('subx');
  if (!/^#[0-9a-f]{6}$/i.test(hex || '')) { delete r.dataset.subc; if (st) st.textContent = ''; return; }
  if (!st) { st = document.createElement('style'); st.id = 'subx'; document.head.appendChild(st); }
  st.textContent = 'html:root[data-subc][data-th]{' + Object.entries(subPal(hex)).map(([k, v]) => '--' + k + ':' + v).join(';') + '}';
  r.dataset.subc = '1';
}
function setSub(x) { const r = document.documentElement; if (x && x.t) r.dataset.sub = x.t; else delete r.dataset.sub; setSubColor(x && x.col); metaTheme(); } // médaille + couleur d'abonné : retirées d'un coup à la fin de l'abonnement
function setTheme(t) { document.documentElement.dataset.th = t; localStorage.th = t; metaTheme(); }
setTheme(localStorage.th || 'dark');
setSkin(localStorage.sk);
async function flip() {
  const t = document.documentElement.dataset.th === 'dark' ? 'light' : 'dark'; setTheme(t);
  if (!isOp) try { await api('settings', { theme: t }); } catch {}
}
function setCat(c) { CAT = c; RAR = {}; for (const [t, o] of Object.entries(CAT)) [...RA].forEach((r) => (o[r] || []).forEach((n) => (RAR[t + ':' + n] = r))); }
function setS(s) { S = s; setSub(s.sub); setCat(s.themes); if (s.theme && s.theme !== localStorage.th) setTheme(s.theme); if (s.skin !== undefined && !SKPV) { if (s.skind) SKC[s.skind.id] = s.skind; if ((s.skin || '') !== SKK || (s.skind && localStorage.skd !== JSON.stringify(s.skind))) setSkin(s.skin); } }

async function api(action, d = {}) {
  const r = await fetch('/api/game', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ action, token: tok, ...(isOp && asP ? { as: 'player' } : {}), ...d }) });
  const t = await r.text(); let j; try { j = JSON.parse(t); } catch { j = { error: 'Réponse invalide (code ' + r.status + ') : ' + t.slice(0, 120) }; if (r.ok) throw new Error(j.error); }
  if (!r.ok) { if (r.status === 401 && tok) logout(); throw new Error(j.error || 'Erreur'); }
  return j;
}
function logout() { localStorage.removeItem('tok'); localStorage.removeItem('op'); localStorage.removeItem('asp'); asP = false; tok = null; isOp = false; clearInterval(timer); authView(); }

// --- Wikipédia : image + titre, mis en cache
const wc = {};
function wiki(t) {
  return wc[t] ||= (async () => {
    try { const c = localStorage['w:' + t]; if (c) return JSON.parse(c); } catch {}
    try {
      const r = await fetch('https://fr.wikipedia.org/api/rest_v1/page/summary/' + encodeURIComponent(t.replace(/ /g, '_')));
      if (!r.ok) return { img: null, title: t };
      const j = await r.json();
      const w = { img: (j.thumbnail && j.thumbnail.source) || null, title: j.title || t };
      try { localStorage['w:' + t] = JSON.stringify(w); } catch {}
      return w;
    } catch { return { img: null, title: t }; }
  })();
}
function cardEl(id, count, i, tier) {
  const name = id.slice(id.indexOf(':') + 1), r = RAR[id] || 'c';
  const el = document.createElement('div');
  el.className = 'card ' + r + (tier ? ' b' + tier : '') + (i != null ? ' pop' : '');
  if (i != null) el.style.setProperty('--i', i);
  el.innerHTML = (tier ? '<span class="bdg">' + BDI[tier] + ' ' + BDN[tier] + '</span>' : '') + '<img class="im" alt=""><div class="ct"></div><div class="rn">' + RN[r] + '</div>' + (count > 1 ? '<span class="n">×' + count + '</span>' : '');
  el.querySelector('.ct').textContent = name;
  wiki(name).then((w) => { el.querySelector('.ct').textContent = w.title; const im = el.querySelector('img'); if (w.img) im.src = w.img; else im.style.visibility = 'hidden'; });
  return el;
}

// --- Solidité du mot de passe (indicatif)
function dur(s) {
  const t = [['seconde', 1], ['minute', 60], ['heure', 3600], ['jour', 86400], ['an', 31536000], ['siècle', 3153600000]];
  if (s < 1) return 'instantané';
  if (s >= 3153600000 * 1000) return 'plus de 1000 siècles';
  let r = t[0]; for (const x of t) if (s >= x[1]) r = x;
  const n = Math.floor(s / r[1]); return n + ' ' + r[0] + (n > 1 ? 's' : '');
}
function meter(p) {
  const el = $('#sm'); if (!p) { el.innerHTML = ''; return; }
  let n = 0; if (/[a-z]/.test(p)) n += 26; if (/[A-Z]/.test(p)) n += 26; if (/\d/.test(p)) n += 10; if (/[^A-Za-z0-9]/.test(p)) n += 32;
  let bits = p.length * Math.log2(n || 1);
  if (/1234|azerty|qwerty|password|motdepasse|0000|1111/i.test(p)) bits = Math.min(bits, 20);
  const lv = bits < 28 ? ['Très faible', '#ff7b72'] : bits < 40 ? ['Faible', '#f0883e'] : bits < 60 ? ['Moyen', '#e3b341'] : bits < 80 ? ['Fort', '#3fb950'] : ['Très fort', '#2ea043'];
  el.innerHTML = '<div class="sm"><i style="width:' + Math.min(100, bits / 80 * 100) + '%;background:' + lv[1] + '"></i></div><small style="color:' + lv[1] + '">' + lv[0] + ' — craqué en ' + dur(Math.pow(2, bits) / 2e10) + ' environ</small>';
}

function authView(msg) {
  app.innerHTML = '<form class="auth" id="f"><img src="/icon-192.png" alt="Cardex" style="width:110px;margin:0 auto"><h1>Cardex</h1><input id="p" placeholder="Pseudo" autocomplete="username" required><input id="w" type="password" placeholder="Mot de passe" autocomplete="current-password" required><div id="sm"></div><div class="err" id="e"></div><button data-a="login">Se connecter</button><button type="button" class="g" data-a="register">Créer un compte</button><button type="button" class="g" id="th">🌓 Thème</button></form>';
  $('#e').textContent = msg || '';
  $('#th').onclick = flip;
  $('#w').oninput = (e) => meter(e.target.value);
  const go = async (a) => {
    try {
      const j = await api(a, { pseudo: $('#p').value, password: $('#w').value });
      tok = j.token; isOp = !!j.op; localStorage.tok = tok; localStorage.op = isOp ? '1' : '0';
      start();
    } catch (e) { $('#e').textContent = e.message; }
  };
  $('#f').onsubmit = (e) => { e.preventDefault(); go('login'); };
  app.querySelector('[data-a=register]').onclick = () => go('register');
}

// --- Joueur
const packsOf = (t) => (S.bought[t] || 0) + S.packs;
